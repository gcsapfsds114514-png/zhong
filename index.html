<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 长征 · 真实地形互动图</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Microsoft YaHei', 'Inter', sans-serif;
      background: #000;
      color: #c8d8e8;
    }

    #timeline-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 300px;
      height: 100vh;
      background: linear-gradient(180deg, rgba(16,24,36,0.92), rgba(12,20,30,0.88));
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(100,160,220,0.25);
      box-shadow: 4px 0 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      z-index: 10;
      padding: 1.2rem 0 0.8rem 0;
      border-radius: 0 16px 16px 0;
    }

    #timeline-panel h2 {
      font-family: 'Georgia', serif;
      font-size: 1.4rem;
      text-align: center;
      margin: 0 0 0.8rem 0;
      color: #7aaac8;
      letter-spacing: 5px;
      border-bottom: 1px solid #2a3a4a;
      padding-bottom: 0.6rem;
      text-shadow: 0 0 15px rgba(100,180,240,0.4);
    }

    .timeline-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 0.7rem;
      scrollbar-width: thin;
      scrollbar-color: #3a6a8a #1a2430;
    }
    .timeline-list::-webkit-scrollbar { width: 4px; }
    .timeline-list::-webkit-scrollbar-track { background: #1a2430; }
    .timeline-list::-webkit-scrollbar-thumb { background: #3a6a8a; border-radius: 10px; }

    .timeline-item {
      background: rgba(24,36,48,0.65);
      border-left: 3px solid #3a7aaa;
      margin-bottom: 0.6rem;
      padding: 0.75rem 0.9rem;
      border-radius: 0 10px 10px 0;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      color: #a0b8cc;
    }
    .timeline-item:hover {
      background: rgba(40,60,80,0.9);
      border-left-color: #6aaad0;
      transform: translateX(3px);
    }
    .timeline-item.active {
      background: rgba(30,55,80,0.95);
      border-left-color: #8ac0e0;
      box-shadow: 0 0 20px rgba(80,160,240,0.35), inset 0 0 10px rgba(100,180,240,0.15);
      color: #e0f0ff;
      transform: scale(1.02);
    }
    .timeline-item .date {
      font-size: 0.7rem;
      color: #6a9aba;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }
    .timeline-item .title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #d0e4f4;
      font-family: 'Georgia', serif;
    }
    .timeline-item .desc {
      font-size: 0.7rem;
      color: #7a94a8;
      margin-top: 0.25rem;
      line-height: 1.35;
    }

    #info-overlay {
      position: absolute;
      bottom: 28px;
      right: 28px;
      background: rgba(10,18,28,0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(100,160,210,0.35);
      border-radius: 14px;
      padding: 1.3rem 1.8rem;
      max-width: 380px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      z-index: 20;
      color: #c8d8e8;
      border-left: 5px solid #4a8ab0;
      pointer-events: none;
    }
    #info-overlay .info-date {
      font-size: 0.8rem;
      color: #6a9aba;
      letter-spacing: 2px;
      margin-bottom: 0.2rem;
    }
    #info-overlay .info-title {
      font-size: 1.6rem;
      font-family: 'Georgia', serif;
      font-weight: 700;
      color: #e0f0ff;
      margin-bottom: 0.4rem;
      text-shadow: 0 0 15px rgba(80,160,240,0.4);
    }
    #info-overlay .info-desc {
      font-size: 0.9rem;
      line-height: 1.55;
      color: #a8c0d4;
    }
    #info-overlay .info-coord {
      margin-top: 0.6rem;
      font-size: 0.7rem;
      color: #5a7a94;
      font-family: monospace;
    }

    #main-title {
      position: absolute;
      top: 18px;
      right: 36px;
      font-family: 'Georgia', serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: rgba(120,180,220,0.25);
      letter-spacing: 18px;
      pointer-events: none;
      z-index: 5;
      text-shadow: 0 0 30px rgba(80,160,240,0.3);
      user-select: none;
    }

    #hint {
      position: absolute;
      bottom: 18px;
      left: 320px;
      color: #4a6a84;
      font-size: 0.75rem;
      letter-spacing: 2px;
      z-index: 5;
      pointer-events: none;
      background: rgba(10,16,24,0.5);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(80,140,190,0.15);
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #6a9aba;
      font-size: 1rem;
      text-align: center;
      z-index: 100;
      background: rgba(10,18,28,0.9);
      padding: 20px 40px;
      border-radius: 16px;
      border: 1px solid #3a6a8a;
      pointer-events: none;
    }
    #loading.hidden { display: none; }

    #progress {
      margin-top: 12px;
      width: 240px;
      height: 4px;
      background: #1a2a3a;
      border-radius: 4px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4a8ab0, #88ccee);
      width: 0%;
      transition: width 0.3s;
    }

    @media (max-width: 800px) {
      #timeline-panel { width: 240px; }
      #main-title { font-size: 1.6rem; right: 16px; letter-spacing: 8px; }
      #info-overlay { bottom: 12px; right: 12px; max-width: 250px; padding: 0.9rem 1rem; }
      #hint { left: 260px; font-size: 0.65rem; }
    }
  </style>
</head>
<body>
  <div id="timeline-panel">
    <h2>长 征 · 征 途</h2>
    <div class="timeline-list" id="timelineList"></div>
    <div style="padding: 0.6rem 1rem 0; font-size: 0.65rem; color: #4a6a84; text-align: center; border-top: 1px solid #1a2a3a;">
      点击事件查看位置
    </div>
  </div>

  <div id="main-title">征 途</div>
  <div id="hint">拖动旋转 · 滚轮缩放 · 点击时间表联动</div>

  <div id="info-overlay">
    <div class="info-date" id="infoDate">1934年10月</div>
    <div class="info-title" id="infoTitle">瑞金出发</div>
    <div class="info-desc" id="infoDesc">中央红军从江西瑞金等地出发，开始战略转移。</div>
    <div class="info-coord" id="infoCoord">纬度: 25.8°N 经度: 116.0°E</div>
  </div>

  <div id="loading">
    正在加载真实地形数据...
    <div id="progress"><div id="progress-bar"></div></div>
    <small style="display:block;margin-top:8px;color:#4a6a84;">数据源: AWS Terrain Tiles (NASA SRTM)</small>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ============ 场景 ============
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050a10);
    scene.fog = new THREE.FogExp2(0x050a10, 0.0012);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 3000);
    camera.position.set(0, 80, 140);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    labelRenderer.domElement.style.zIndex = '5';
    document.body.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 50;
    controls.maxDistance = 300;
    controls.target.set(0, 0, 0);

    // ============ 灯光 ============
    scene.add(new THREE.AmbientLight(0x5a6a7a, 1.4));

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(-60, 100, 60);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    const d = 150;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 500;
    scene.add(dirLight);

    const backLight = new THREE.PointLight(0x2a6a9a, 0.6);
    backLight.position.set(80, 60, -80);
    scene.add(backLight);

    // ============ 参数 ============
    const LON_MIN = 73, LON_MAX = 136;
    const LAT_MIN = 18, LAT_MAX = 54;
    
    const ZOOM = 5;
    
    const GRID_W = 200;
    const GRID_H = 133;
    
    const PLANE_W = 200;
    const PLANE_H = 133;

    // 高度缩放
    const HEIGHT_SCALE = 0.0018;

    // ============ 经纬度→瓦片坐标 ============
    function lonLatToTile(lon, lat, zoom) {
      const n = Math.pow(2, zoom);
      const x = Math.floor((lon + 180) / 360 * n);
      const latRad = lat * Math.PI / 180;
      const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
      return { x, y };
    }

    // ============ 加载瓦片 ============
    const loadingEl = document.getElementById('loading');
    const progressBar = document.getElementById('progress-bar');

    async function loadTerrainTiles() {
      const topLeft = lonLatToTile(LON_MIN, LAT_MAX, ZOOM);
      const bottomRight = lonLatToTile(LON_MAX, LAT_MIN, ZOOM);
      
      const x0 = topLeft.x, x1 = bottomRight.x;
      const y0 = topLeft.y, y1 = bottomRight.y;
      
      const tilesX = x1 - x0 + 1;
      const tilesY = y1 - y0 + 1;
      const totalTiles = tilesX * tilesY;
      
      console.log(`需要加载 ${totalTiles} 张瓦片`);

      const TILE_SIZE = 256;
      const canvasW = tilesX * TILE_SIZE;
      const canvasH = tilesY * TILE_SIZE;
      
      const canvas = document.createElement('canvas');
      canvas.width = canvasW;
      canvas.height = canvasH;
      const ctx = canvas.getContext('2d');
      
      let loaded = 0;
      
      const loadTile = (x, y, px, py) => {
        return new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          const url = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${ZOOM}/${x}/${y}.png`;
          
          img.onload = () => {
            ctx.drawImage(img, px, py);
            loaded++;
            progressBar.style.width = (loaded / totalTiles * 100) + '%';
            resolve();
          };
          img.onerror = () => {
            console.warn('瓦片加载失败:', url);
            loaded++;
            progressBar.style.width = (loaded / totalTiles * 100) + '%';
            resolve();
          };
          img.src = url;
        });
      };
      
      const promises = [];
      for (let ty = 0; ty < tilesY; ty++) {
        for (let tx = 0; tx < tilesX; tx++) {
          promises.push(loadTile(x0 + tx, y0 + ty, tx * TILE_SIZE, ty * TILE_SIZE));
        }
      }
      
      await Promise.all(promises);
      
      // 解析 Terrarium
      const heightData = new Float32Array(canvasW * canvasH);
      const imgData = ctx.getImageData(0, 0, canvasW, canvasH).data;
      for (let i = 0; i < canvasW * canvasH; i++) {
        const r = imgData[i*4];
        const g = imgData[i*4+1];
        const b = imgData[i*4+2];
        const elevation = (r * 256 + g + b / 256) - 32768;
        heightData[i] = elevation;
      }
      
      return { heightData, canvasW, canvasH };
    }

    // ============ 加载你的地形图照片 ============
    function loadPhotoTexture() {
      return new Promise((resolve) => {
        const loader = new THREE.TextureLoader();
        loader.crossOrigin = 'anonymous';
        loader.load(
          'terrain.jpg',
          (texture) => {
            texture.encoding = THREE.sRGBEncoding;
            texture.anisotropy = 16;
            resolve(texture);
          },
          undefined,
          () => {
            // 加载失败：用纯色兜底
            console.warn('未找到 terrain.jpg，使用纯色纹理');
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 545;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#4a5a4a';
            ctx.fillRect(0, 0, 800, 545);
            ctx.fillStyle = '#aaccee';
            ctx.font = 'bold 40px serif';
            ctx.textAlign = 'center';
            ctx.fillText('未找到 terrain.jpg', 400, 260);
            const fallback = new THREE.CanvasTexture(canvas);
            fallback.encoding = THREE.sRGBEncoding;
            resolve(fallback);
          }
        );
      });
    }

    // ============ 创建地形 ============
    function createTerrain(heightData, canvasW, canvasH, photoTexture) {
      const geometry = new THREE.PlaneGeometry(PLANE_W, PLANE_H, GRID_W - 1, GRID_H - 1);
      geometry.rotateX(-Math.PI / 2);
      
      const positions = geometry.attributes.position;
      
      for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i);
        const z = positions.getZ(i);
        
        const u = (x / PLANE_W) + 0.5;
        const v = (z / PLANE_H) + 0.5;
        
        const sx = Math.min(canvasW - 1, Math.max(0, Math.floor(u * canvasW)));
        const sy = Math.min(canvasH - 1, Math.max(0, Math.floor(v * canvasH)));
        
        const elevation = heightData[sy * canvasW + sx];
        const h = Math.max(0, elevation) * HEIGHT_SCALE;
        
        positions.setY(i, h);
      }
      
      geometry.computeVertexNormals();
      
      // 关键：用照片作为贴图
      const material = new THREE.MeshStandardMaterial({
        map: photoTexture,        // 你的地形图照片
        roughness: 0.8,
        metalness: 0.08,
        emissive: new THREE.Color(0x1a2a3a),
        emissiveIntensity: 0.1,
        side: THREE.DoubleSide,
      });
      
      const terrain = new THREE.Mesh(geometry, material);
      terrain.castShadow = true;
      terrain.receiveShadow = true;
      scene.add(terrain);
      
      window.__terrainData = {
        heightData,
        canvasW,
        canvasH,
        PLANE_W,
        PLANE_H,
        HEIGHT_SCALE,
      };
      
      return terrain;
    }

    // ============ 坐标映射 ============
    function geoToLocal3D(lon, lat) {
      const u = (lon - LON_MIN) / (LON_MAX - LON_MIN);
      const v = 1 - (lat - LAT_MIN) / (LAT_MAX - LAT_MIN);
      
      const x = (u - 0.5) * PLANE_W;
      const z = (v - 0.5) * PLANE_H;
      
      let y = 0;
      if (window.__terrainData) {
        const { heightData, canvasW, canvasH, HEIGHT_SCALE } = window.__terrainData;
        const sx = Math.min(canvasW - 1, Math.max(0, Math.floor(u * canvasW)));
        const sy = Math.min(canvasH - 1, Math.max(0, Math.floor(v * canvasH)));
        y = Math.max(0, heightData[sy * canvasW + sx]) * HEIGHT_SCALE;
      }
      
      return new THREE.Vector3(x, y, z);
    }

    // ============ 长征事件 ============
    const events = [
      { date: '1934年10月', title: '瑞金出发', desc: '中央红军从江西瑞金等地出发，开始战略转移。', coord: '25.8°N, 116.0°E', lon: 116.0, lat: 25.8 },
      { date: '1934年11月', title: '湘江战役', desc: '红军突破第四道封锁线，损失惨重。', coord: '25.5°N, 111.0°E', lon: 111.0, lat: 25.5 },
      { date: '1935年1月', title: '遵义会议', desc: '确立毛泽东同志的领导地位，是长征转折点。', coord: '27.7°N, 106.9°E', lon: 106.9, lat: 27.7 },
      { date: '1935年2月', title: '四渡赤水', desc: '机动灵活，摆脱国民党军追堵。', coord: '28.1°N, 105.8°E', lon: 105.8, lat: 28.1 },
      { date: '1935年5月', title: '巧渡金沙江', desc: '摆脱数十万敌军围追堵截。', coord: '26.5°N, 102.0°E', lon: 102.0, lat: 26.5 },
      { date: '1935年5月', title: '飞夺泸定桥', desc: '22勇士冒火夺取铁索桥。', coord: '29.9°N, 102.2°E', lon: 102.2, lat: 29.9 },
      { date: '1935年6月', title: '翻越夹金山', desc: '征服第一座大雪山。', coord: '30.8°N, 102.7°E', lon: 102.7, lat: 30.8 },
      { date: '1935年8月', title: '穿过草地', desc: '艰难穿越松潘草地，牺牲巨大。', coord: '33.0°N, 102.5°E', lon: 102.5, lat: 33.0 },
      { date: '1935年10月', title: '抵达吴起镇', desc: '中央红军到达陕北，长征胜利结束。', coord: '36.9°N, 108.2°E', lon: 108.2, lat: 36.9 },
    ];

    // ============ 创建标记与路线 ============
    const markers = [];

    function createMarkersAndRoutes() {
      const worldPositions = events.map(e => geoToLocal3D(e.lon, e.lat));
      
      events.forEach((event, index) => {
        const pos = worldPositions[index];
        const spherePos = pos.clone();
        spherePos.y += 3.0;
        
        const sphereGeo = new THREE.SphereGeometry(1.5, 20, 20);
        const sphereMat = new THREE.MeshStandardMaterial({
          color: 0x5a9ac0,
          emissive: new THREE.Color(0x2a6a9a),
          emissiveIntensity: 1.6,
          roughness: 0.25,
          metalness: 0.3,
        });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.copy(spherePos);
        sphere.castShadow = true;
        scene.add(sphere);
        
        const glowGeo = new THREE.SphereGeometry(2.8, 12, 12);
        const glowMat = new THREE.MeshBasicMaterial({
          color: 0x6ab0d0,
          transparent: true,
          opacity: 0.12,
          wireframe: true,
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.copy(spherePos);
        scene.add(glow);
        
        const pillarGeo = new THREE.CylinderGeometry(0.1, 0.18, 3.0, 8);
        const pillarMat = new THREE.MeshStandardMaterial({
          color: 0x7ab0d0,
          emissive: new THREE.Color(0x1a4a6a),
          transparent: true,
          opacity: 0.6,
        });
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(pos.x, pos.y + 1.5, pos.z);
        scene.add(pillar);
        
        const ringGeo = new THREE.RingGeometry(1.8, 2.3, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0x4a8ab0,
          transparent: true,
          opacity: 0.5,
          side: THREE.DoubleSide,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.copy(pos);
        ring.rotation.x = -Math.PI / 2;
        scene.add(ring);
        
        const labelDiv = document.createElement('div');
        labelDiv.textContent = `${index+1}. ${event.title}`;
        labelDiv.style.color = '#c0d8e8';
        labelDiv.style.fontSize = '12px';
        labelDiv.style.fontWeight = 'bold';
        labelDiv.style.textShadow = '1px 1px 4px #000';
        labelDiv.style.background = 'rgba(12,20,30,0.85)';
        labelDiv.style.padding = '3px 12px';
        labelDiv.style.borderRadius = '20px';
        labelDiv.style.borderLeft = '3px solid #4a8ab0';
        labelDiv.style.whiteSpace = 'nowrap';
        labelDiv.style.pointerEvents = 'none';
        
        const label = new CSS2DObject(labelDiv);
        label.position.set(spherePos.x, spherePos.y + 3.5, spherePos.z);
        scene.add(label);
        
        markers.push({ sphere, glow, labelDiv, finalPos: spherePos, ring, event });
      });
      
      const routePoints = worldPositions.map(p => {
        const np = p.clone();
        np.y += 3.0;
        return np;
      });
      
      const curve = new THREE.CatmullRomCurve3(routePoints);
      
      const tubeGeo = new THREE.TubeGeometry(curve, 200, 0.5, 8, false);
      const tubeMat = new THREE.MeshStandardMaterial({
        color: 0x4a8aaa,
        emissive: new THREE.Color(0x1a4a6a),
        roughness: 0.3,
        metalness: 0.2,
        transparent: true,
        opacity: 0.9,
      });
      const tube = new THREE.Mesh(tubeGeo, tubeMat);
      scene.add(tube);
      
      const tubeGlowGeo = new THREE.TubeGeometry(curve, 200, 0.22, 6, false);
      const tubeGlowMat = new THREE.MeshStandardMaterial({
        color: 0x88ccee,
        emissive: new THREE.Color(0x4488bb),
        transparent: true,
        opacity: 0.6,
      });
      const tubeGlow = new THREE.Mesh(tubeGlowGeo, tubeGlowMat);
      scene.add(tubeGlow);
    }

    // ============ 时间表 UI ============
    const timelineList = document.getElementById('timelineList');
    events.forEach((event, index) => {
      const item = document.createElement('div');
      item.className = 'timeline-item' + (index === 0 ? ' active' : '');
      item.dataset.index = index;
      item.innerHTML = `
        <div class="date">${event.date}</div>
        <div class="title">${event.title}</div>
        <div class="desc">${event.desc}</div>
      `;
      item.addEventListener('click', () => setActiveEvent(index));
      timelineList.appendChild(item);
    });

    const infoDate = document.getElementById('infoDate');
    const infoTitle = document.getElementById('infoTitle');
    const infoDesc = document.getElementById('infoDesc');
    const infoCoord = document.getElementById('infoCoord');

    let activeIndex = -1;

    function setActiveEvent(index) {
      if (index === activeIndex) return;
      activeIndex = index;
      
      document.querySelectorAll('.timeline-item').forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });
      
      const ev = events[index];
      infoDate.textContent = ev.date;
      infoTitle.textContent = ev.title;
      infoDesc.textContent = ev.desc;
      infoCoord.textContent = `纬度: ${ev.coord.split(',')[0]}  经度: ${ev.coord.split(',')[1]}`;
      
      markers.forEach((marker, i) => {
        if (i === index) {
          marker.sphere.material.emissiveIntensity = 3.0;
          marker.sphere.scale.set(1.5, 1.5, 1.5);
          marker.glow.material.opacity = 0.5;
          marker.glow.scale.set(1.4, 1.4, 1.4);
          marker.labelDiv.style.background = 'rgba(60,120,180,0.95)';
          marker.labelDiv.style.color = '#fff';
          marker.labelDiv.style.borderLeftColor = '#88ccee';
          marker.ring.material.opacity = 0.9;
          marker.ring.scale.set(1.3, 1.3, 1.3);
        } else {
          marker.sphere.material.emissiveIntensity = 1.6;
          marker.sphere.scale.set(1, 1, 1);
          marker.glow.material.opacity = 0.12;
          marker.glow.scale.set(1, 1, 1);
          marker.labelDiv.style.background = 'rgba(12,20,30,0.85)';
          marker.labelDiv.style.color = '#c0d8e8';
          marker.labelDiv.style.borderLeftColor = '#4a8ab0';
          marker.ring.material.opacity = 0.5;
          marker.ring.scale.set(1, 1, 1);
        }
      });
      
      const targetPos = markers[index].finalPos;
      controls.target.copy(targetPos);
      const camOffset = new THREE.Vector3(0, 35, 55);
      camera.position.copy(targetPos.clone().add(camOffset));
      controls.update();
    }

    // ============ 主流程 ============
    async function init() {
      try {
        // 并行：加载瓦片 + 加载照片
        const [terrainResult, photoTexture] = await Promise.all([
          loadTerrainTiles(),
          loadPhotoTexture(),
        ]);
        
        const { heightData, canvasW, canvasH } = terrainResult;
        
        // 创建地形（照片作为纹理）
        createTerrain(heightData, canvasW, canvasH, photoTexture);
        
        // 创建标记和路线
        createMarkersAndRoutes();
        
        loadingEl.classList.add('hidden');
        
        setTimeout(() => setActiveEvent(0), 300);
        
      } catch (err) {
        console.error('加载失败:', err);
        loadingEl.innerHTML = '地形数据加载失败<br><small style="color:#4a6a84;">请检查网络连接</small>';
      }
    }

    // ============ 动画 ============
    function animate() {
      requestAnimationFrame(animate);
      
      const time = Date.now() * 0.002;
      markers.forEach((marker, i) => {
        if (i === activeIndex) {
          const scale = 1.3 + Math.sin(time * 3) * 0.25;
          marker.glow.scale.set(scale, scale, scale);
          marker.glow.material.opacity = 0.35 + Math.sin(time * 4) * 0.2;
        }
      });
      
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    animate();

    // ============ 窗口自适应 ============
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.getElementById('timeline-panel').addEventListener('wheel', (e) => {
      e.stopPropagation();
    }, { passive: false });

    init();
  </script>
</body>
</html>
