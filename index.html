<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中国工农红军长征历程 · 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      font-family: 'Microsoft YaHei', 'Inter', sans-serif;
      background: #0a0806;
      color: #e8dcc8;
    }

    /* 顶部标题栏 */
    #top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: linear-gradient(180deg, rgba(20,15,10,0.95), rgba(20,15,10,0.7));
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 20;
      border-bottom: 1px solid rgba(180,140,80,0.2);
    }
    #top-bar .logo {
      font-family: 'Georgia', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #d4a850;
      letter-spacing: 4px;
      margin-right: 16px;
      text-shadow: 0 0 20px rgba(212,168,80,0.4);
    }
    #top-bar .dates {
      font-size: 0.85rem;
      color: #8a7050;
      letter-spacing: 2px;
      margin-right: 24px;
    }
    #top-bar .title {
      font-size: 1rem;
      color: #c8b498;
      letter-spacing: 4px;
      flex: 1;
      text-align: center;
    }
    #top-bar .icons {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #top-bar .icon-btn {
      width: 32px; height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(60,50,40,0.6);
      color: #c8b498;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    #top-bar .icon-btn:hover {
      background: rgba(120,90,50,0.7);
      color: #e8dcc8;
    }

    /* 左上角说明 */
    #left-info {
      position: absolute;
      top: 80px; left: 28px;
      z-index: 15;
      pointer-events: none;
    }
    #left-info .small {
      font-size: 0.7rem;
      color: #8a7050;
      letter-spacing: 4px;
      margin-bottom: 6px;
    }
    #left-info .big {
      font-family: 'Georgia', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: #e8d0a0;
      letter-spacing: 4px;
      text-shadow: 0 2px 30px rgba(0,0,0,0.9), 0 0 40px rgba(212,168,80,0.3);
      line-height: 1.1;
    }
    #left-info .years {
      font-size: 0.9rem;
      color: #d4a850;
      letter-spacing: 3px;
      margin-top: 8px;
      margin-bottom: 12px;
    }
    #left-info .hint-text {
      font-size: 0.75rem;
      color: #a08868;
      letter-spacing: 1px;
    }

    /* 右侧竖排按钮 */
    #right-tools {
      position: absolute;
      top: 80px; right: 20px;
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }
    .tool-group {
      display: flex;
      gap: 6px;
      background: rgba(20,15,10,0.75);
      backdrop-filter: blur(8px);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid rgba(180,140,80,0.2);
    }
    .tool-btn {
      padding: 6px 12px;
      background: transparent;
      color: #c8b498;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tool-btn:hover, .tool-btn.active {
      background: rgba(212,168,80,0.2);
      color: #e8d0a0;
    }

    /* 右下角比例尺 */
    #scale-info {
      position: absolute;
      bottom: 90px; right: 24px;
      z-index: 15;
      font-size: 0.7rem;
      color: #8a7050;
      letter-spacing: 1px;
      text-align: right;
      pointer-events: none;
    }

    /* 加载提示 */
    #loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #d4a850;
      font-size: 0.95rem;
      text-align: center;
      z-index: 100;
      background: rgba(15,12,8,0.95);
      padding: 24px 44px;
      border-radius: 14px;
      border: 1px solid rgba(180,140,80,0.4);
      letter-spacing: 2px;
    }
    #loading.hidden { display: none; }
    #progress {
      margin-top: 14px;
      width: 260px;
      height: 3px;
      background: rgba(60,50,40,0.8);
      border-radius: 3px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #b8860b, #f0c060);
      width: 0%;
      transition: width 0.3s;
    }

    /* 底部时间条 */
    #bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 76px;
      background: linear-gradient(0deg, rgba(20,15,10,0.98), rgba(20,15,10,0.85));
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(180,140,80,0.25);
      z-index: 20;
      display: flex;
      align-items: center;
      padding: 0 60px 0 40px;
    }
    #bottom-bar .label {
      font-size: 0.75rem;
      color: #8a7050;
      letter-spacing: 3px;
      margin-right: 20px;
      white-space: nowrap;
    }
    #timeline-scroll {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      padding: 0 10px;
      scrollbar-width: none;
    }
    #timeline-scroll::-webkit-scrollbar { display: none; }

    .tl-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 18px;
      cursor: pointer;
      transition: all 0.25s;
      border-top: 2px solid transparent;
      position: relative;
      white-space: nowrap;
    }
    .tl-item:hover {
      background: rgba(212,168,80,0.08);
    }
    .tl-item.active {
      border-top-color: #d4a850;
      background: rgba(212,168,80,0.12);
    }
    .tl-item .date {
      font-size: 0.7rem;
      color: #8a7050;
      letter-spacing: 1px;
      margin-bottom: 4px;
      transition: color 0.2s;
    }
    .tl-item .name {
      font-size: 0.9rem;
      color: #c8b498;
      font-weight: 600;
      letter-spacing: 1px;
      transition: color 0.2s;
    }
    .tl-item.active .date { color: #d4a850; }
    .tl-item.active .name { color: #f0e0c0; }

    /* 时间条两侧箭头 */
    .nav-arrow {
      width: 32px; height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c8b498;
      cursor: pointer;
      border-radius: 50%;
      background: rgba(60,50,40,0.5);
      font-size: 1.1rem;
      transition: all 0.2s;
      user-select: none;
    }
    .nav-arrow:hover {
      background: rgba(212,168,80,0.3);
      color: #f0e0c0;
    }

    /* 视角切换 */
    #view-toggle {
      position: absolute;
      bottom: 90px; left: 40px;
      z-index: 15;
      display: flex;
      background: rgba(20,15,10,0.75);
      backdrop-filter: blur(8px);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid rgba(180,140,80,0.2);
    }
    #view-toggle button {
      padding: 5px 14px;
      background: transparent;
      color: #a08868;
      border: none;
      border-radius: 5px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    #view-toggle button.active {
      background: rgba(212,168,80,0.25);
      color: #e8d0a0;
    }

    /* 详情浮层（点击标记出现） */
    #detail-panel {
      position: absolute;
      top: 80px; left: 50%;
      transform: translateX(-50%);
      background: rgba(15,12,8,0.95);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(180,140,80,0.4);
      border-radius: 12px;
      padding: 16px 28px;
      z-index: 25;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      text-align: center;
      max-width: 500px;
    }
    #detail-panel.show { opacity: 1; }
    #detail-panel .d-date {
      font-size: 0.8rem;
      color: #d4a850;
      letter-spacing: 4px;
      margin-bottom: 6px;
    }
    #detail-panel .d-title {
      font-family: 'Georgia', serif;
      font-size: 1.6rem;
      color: #f0e0c0;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    #detail-panel .d-desc {
      font-size: 0.85rem;
      color: #b8a488;
      line-height: 1.6;
      letter-spacing: 1px;
    }

    @media (max-width: 900px) {
      #top-bar .title { display: none; }
      #left-info .big { font-size: 1.6rem; }
      #bottom-bar { height: 68px; padding: 0 20px; }
      .tl-item { padding: 6px 10px; }
      .tl-item .name { font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- 顶部栏 -->
  <div id="top-bar">
    <div class="logo">长征</div>
    <div class="dates">1934—1936</div>
    <div class="title">中国工农红军长征历程</div>
    <div class="icons">
      <div class="icon-btn">🔊</div>
      <div class="icon-btn">⛶</div>
    </div>
  </div>

  <!-- 左上角信息 -->
  <div id="left-info">
    <div class="small">长征历史课</div>
    <div class="big">长征路线</div>
    <div class="years">1934—1936</div>
    <div class="hint-text">点击底部事件查看详情</div>
  </div>

  <!-- 右侧工具栏 -->
  <div id="right-tools">
    <div class="tool-group">
      <button class="tool-btn" onclick="zoomIn()">放大</button>
      <button class="tool-btn" onclick="zoomOut()">缩小</button>
      <button class="tool-btn" onclick="resetView()">复位</button>
    </div>
  </div>

  <!-- 比例尺 -->
  <div id="scale-info">
    地图比例尺 1 : 2700万<br>
    <span style="font-size:0.65rem;">数据来源: NASA SRTM / Esri 卫星影像</span>
  </div>

  <!-- 视角切换 -->
  <div id="view-toggle">
    <button id="btn3d" class="active" onclick="setView('3d')">3D 立体</button>
    <button id="btnTop" onclick="setView('top')">平面</button>
  </div>

  <!-- 详情浮层 -->
  <div id="detail-panel">
    <div class="d-date" id="dDate">1934年10月</div>
    <div class="d-title" id="dTitle">瑞金出发</div>
    <div class="d-desc" id="dDesc">中央红军从江西瑞金等地出发，开始战略转移。</div>
  </div>

  <!-- 加载 -->
  <div id="loading">
    正在加载真实地形数据...
    <div id="progress"><div id="progress-bar"></div></div>
    <small style="display:block;margin-top:10px;color:#8a7050;font-size:0.7rem;">NASA SRTM 30m 高程数据</small>
  </div>

  <!-- 底部时间条 -->
  <div id="bottom-bar">
    <div class="label">长征大事记</div>
    <div class="nav-arrow" onclick="scrollTimeline(-1)">‹</div>
    <div id="timeline-scroll"></div>
    <div class="nav-arrow" onclick="scrollTimeline(1)">›</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ============ 场景 ============
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0806);
    scene.fog = new THREE.FogExp2(0x0a0806, 0.0018);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 3000);
    // 俯视斜角，从东南往西北看
    camera.position.set(60, 90, 90);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    labelRenderer.domElement.style.zIndex = '5';
    document.body.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 60;
    controls.maxDistance = 280;
    controls.target.set(0, 0, 0);

    // ============ 灯光（暖色调，模拟高原日照） ============
    scene.add(new THREE.AmbientLight(0x6a5a4a, 1.0));

    // 主光：暖黄方向光
    const dirLight = new THREE.DirectionalLight(0xffe8c0, 1.3);
    dirLight.position.set(-80, 120, 60);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    const d = 160;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 500;
    scene.add(dirLight);

    // 补光：冷色
    const fillLight = new THREE.DirectionalLight(0x88aacc, 0.35);
    fillLight.position.set(60, 40, -80);
    scene.add(fillLight);

    // 环境暖光
    const warmLight = new THREE.PointLight(0xb8860b, 0.5);
    warmLight.position.set(0, 40, 0);
    scene.add(warmLight);

    // ============ 参数 ============
    const LON_MIN = 73, LON_MAX = 136;
    const LAT_MIN = 18, LAT_MAX = 54;

    const ZOOM = 5;
    const GRID_W = 280;
    const GRID_H = 186;
    const PLANE_W = 220;
    const PLANE_H = 146;
    const HEIGHT_SCALE = 0.0022;

    // ============ 瓦片坐标转换 ============
    function lonLatToTile(lon, lat, zoom) {
      const n = Math.pow(2, zoom);
      const x = Math.floor((lon + 180) / 360 * n);
      const latRad = lat * Math.PI / 180;
      const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
      return { x, y };
    }

    // ============ 加载高程瓦片（Terrarium） ============
    const loadingEl = document.getElementById('loading');
    const progressBar = document.getElementById('progress-bar');

    async function loadTerrainTiles() {
      const topLeft = lonLatToTile(LON_MIN, LAT_MAX, ZOOM);
      const bottomRight = lonLatToTile(LON_MAX, LAT_MIN, ZOOM);
      const x0 = topLeft.x, x1 = bottomRight.x;
      const y0 = topLeft.y, y1 = bottomRight.y;
      const tilesX = x1 - x0 + 1;
      const tilesY = y1 - y0 + 1;
      const totalTiles = tilesX * tilesY;

      console.log(`需要加载 ${totalTiles} 张高程瓦片`);

      const TILE_SIZE = 256;
      const canvasW = tilesX * TILE_SIZE;
      const canvasH = tilesY * TILE_SIZE;
      const canvas = document.createElement('canvas');
      canvas.width = canvasW;
      canvas.height = canvasH;
      const ctx = canvas.getContext('2d');

      let loaded = 0;
      const loadTile = (x, y, px, py) => {
        return new Promise(resolve => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          const url = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${ZOOM}/${x}/${y}.png`;
          img.onload = () => {
            ctx.drawImage(img, px, py);
            loaded++;
            progressBar.style.width = (loaded/totalTiles*100) + '%';
            resolve();
          };
          img.onerror = () => {
            loaded++;
            progressBar.style.width = (loaded/totalTiles*100) + '%';
            resolve();
          };
          img.src = url;
        });
      };

      const promises = [];
      for (let ty = 0; ty < tilesY; ty++) {
        for (let tx = 0; tx < tilesX; tx++) {
          promises.push(loadTile(x0+tx, y0+ty, tx*TILE_SIZE, ty*TILE_SIZE));
        }
      }
      await Promise.all(promises);

      // 解析 Terrarium 高程
      const heightData = new Float32Array(canvasW * canvasH);
      const imgData = ctx.getImageData(0, 0, canvasW, canvasH).data;
      for (let i = 0; i < canvasW * canvasH; i++) {
        const r = imgData[i*4];
        const g = imgData[i*4+1];
        const b = imgData[i*4+2];
        heightData[i] = (r*256 + g + b/256) - 32768;
      }
      return { heightData, canvasW, canvasH };
    }

    // ============ 加载卫星纹理（Esri 免费瓦片） ============
    async function loadSatelliteTexture() {
      const topLeft = lonLatToTile(LON_MIN, LAT_MAX, ZOOM);
      const bottomRight = lonLatToTile(LON_MAX, LAT_MIN, ZOOM);
      const x0 = topLeft.x, x1 = bottomRight.x;
      const y0 = topLeft.y, y1 = bottomRight.y;
      const tilesX = x1 - x0 + 1;
      const tilesY = y1 - y0 + 1;
      const TILE_SIZE = 256;
      const canvasW = tilesX * TILE_SIZE;
      const canvasH = tilesY * TILE_SIZE;
      const canvas = document.createElement('canvas');
      canvas.width = canvasW;
      canvas.height = canvasH;
      const ctx = canvas.getContext('2d');

      const loadTile = (x, y, px, py) => {
        return new Promise(resolve => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          // Esri 世界影像服务（免费，无需 key）
          const url = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${ZOOM}/${y}/${x}`;
          img.onload = () => {
            ctx.drawImage(img, px, py);
            resolve();
          };
          img.onerror = () => resolve();
          img.src = url;
        });
      };

      const promises = [];
      for (let ty = 0; ty < tilesY; ty++) {
        for (let tx = 0; tx < tilesX; tx++) {
          promises.push(loadTile(x0+tx, y0+ty, tx*TILE_SIZE, ty*TILE_SIZE));
        }
      }
      await Promise.all(promises);

      const texture = new THREE.CanvasTexture(canvas);
      texture.encoding = THREE.sRGBEncoding;
      texture.anisotropy = 16;
      return texture;
    }

    // ============ 中国简化轮廓（用于裁剪地形） ============
    // 经纬度坐标数组 [lon, lat]，大致勾勒中国边界
    const CHINA_OUTLINE = [
      [73.5, 39.4], [74.9, 37.0], [75.0, 36.7], [76.0, 35.5], [78.0, 35.5],
      [79.0, 34.0], [78.8, 33.5], [79.5, 32.5], [81.0, 30.3], [82.0, 30.3],
      [85.0, 28.2], [88.0, 27.9], [89.0, 28.0], [91.5, 27.8], [94.0, 27.7],
      [95.5, 28.0], [97.0, 28.3], [98.5, 27.5], [98.7, 26.0], [97.5, 24.0],
      [99.0, 22.5], [101.0, 22.4], [102.0, 22.4], [103.5, 22.6], [105.0, 22.8],
      [106.5, 22.0], [108.0, 21.5], [109.5, 21.5], [110.0, 21.0], [112.0, 21.5],
      [113.5, 22.2], [114.5, 22.5], [116.0, 22.8], [117.5, 23.8], [119.0, 25.0],
      [120.0, 26.5], [121.0, 28.0], [121.5, 30.0], [121.9, 31.0], [120.5, 32.5],
      [119.5, 34.5], [120.0, 36.0], [122.0, 37.0], [122.5, 39.0], [121.0, 40.0],
      [119.0, 39.5], [118.0, 39.0], [117.5, 38.5], [119.0, 37.5], [122.5, 37.5],
      [122.0, 40.5], [124.0, 40.0], [126.0, 41.5], [128.0, 42.0], [130.5, 42.5],
      [131.5, 44.5], [133.0, 45.0], [134.5, 48.3], [130.0, 48.5], [127.5, 50.0],
      [125.5, 53.0], [120.0, 53.5], [117.0, 49.5], [115.5, 47.8], [111.5, 44.5],
      [105.0, 41.8], [96.5, 42.8], [90.5, 45.0], [87.5, 49.2], [85.5, 47.0],
      [83.0, 47.2], [80.5, 45.0], [80.0, 42.5], [76.5, 41.0], [74.0, 40.5],
      [73.5, 39.4]
    ];

    // 判断一个经纬度点是否在中国轮廓内（射线法）
    function isInsideChina(lon, lat) {
      let inside = false;
      const poly = CHINA_OUTLINE;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i][0], yi = poly[i][1];
        const xj = poly[j][0], yj = poly[j][1];
        const intersect = ((yi > lat) !== (yj > lat)) &&
          (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // ============ 创建地形（带中国轮廓裁剪） ============

          const s = 1.3 + Math.sin(t * 3) * 0.3;
          m.glow.scale.set(s, s, s);
          m.glow.material.opacity = 0.35 + Math.sin(t * 4) * 0.2;
        }
      });

      // 路线上的流动点
      flowDots.forEach((dot, i) => {
        dot.userData.t += 0.0015;
        if (dot.userData.t > 1) dot.userData.t -= 1;
        const p = curve.getPointAt(dot.userData.t);
        dot.position.copy(p);
      });

      requestAnimationFrame(() => {});
    }
    animatePart2();

    console.log('✅ 第二段初始化完成：标记、路线、时间条');
  });
</script>
